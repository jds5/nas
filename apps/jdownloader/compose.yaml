name: nas-jdownloader
services:
  jdownloader:
    image: sha256:db488d0e67f545758da53b19f6d4a369d65b0c770042f70b668c51e03b58684a
    pull_policy: never
    restart: unless-stopped
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      UMASK: "0077"
      TZ: Asia/Shanghai
      KEEP_APP_RUNNING: "1"
      JDOWNLOADER_MAX_MEM: 1024M
      DISPLAY_WIDTH: "1440"
      DISPLAY_HEIGHT: "900"
      WEB_FILE_MANAGER: "0"
      WEB_TERMINAL: "0"
    volumes:
      - /opt/nas/cache/jdownloader/config:/config
      - /opt/nas/cache/jdownloader/downloads:/output
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "1000:1000"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    ports:
      - "192.168.50.33:5800:5800"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/nas/cache/jdownloader/private/htpasswd:/etc/nginx/htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    depends_on: [jdownloader]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
