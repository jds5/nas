# NAS 内网下载界面；镜像来源、认证与回滚见 README。
name: nas-baidupcs-web
services:
  web:
    image: sha256:8f635868d03316141487bcc1861eb4605d02cc003f540d44adbdc0e6dcc60cce
    pull_policy: never
    user: "1000:1000"
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      RUST_LOG: info
    volumes:
      - type: bind
        source: /opt/nas/cache/baidupcs-downloads/.web-state/config
        target: /app/config
        bind:
          create_host_path: false
      - type: bind
        source: /opt/nas/cache/baidupcs-downloads/.web-state/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/nas/cache/baidupcs-downloads/.web-state/logs
        target: /app/logs
        bind:
          create_host_path: false
      - type: bind
        source: /opt/nas/cache/baidupcs-downloads/.web-state/wal
        target: /app/wal
        bind:
          create_host_path: false
      - type: bind
        source: /opt/nas/cache/baidupcs-downloads/web
        target: /app/downloads
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:18888/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  gateway:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "1000:1000"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    ports:
      - "192.168.50.33:18888:18888"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/nas/cache/baidupcs-downloads/.web-state/gateway/htpasswd:/etc/nginx/htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
