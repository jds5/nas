worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_origin $bad_origin {
        default 1;
        '' 0;
        'http://192.168.50.33:18888' 0;
        'http://127.0.0.1:18888' 0;
    }
    server {
        listen 18888;
        server_name 192.168.50.33 127.0.0.1;
        auth_basic "NAS Baidu Downloads";
        auth_basic_user_file /etc/nginx/htpasswd;
        if ($bad_origin) { return 403; }
        if ($http_sec_fetch_site = cross-site) { return 403; }
        client_max_body_size 2m;
        location / {
            proxy_pass http://web:18888;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
        }
    }
}
