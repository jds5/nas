# NPM Advanced：drop.rokano.org（橙云 + Access）。含 location / 时 NPM 不再生成默认 location。
# 授权边界是应用逐请求验证 Access JWT；这里只做方法与体积限制。
location / {
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 3s;
    set $file_drop_page http://nas-file-drop:3000;
    proxy_pass $file_drop_page$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 用 TCP 连接的真实来源（NPM 全局信任私有网段与 CDN 网段的 X-Real-IP，$remote_addr 可被伪造）：
    # 经 Cloudflare 时为边缘 IP，直连源站时为真实来源，用于记录被拒请求。
    proxy_set_header X-Real-IP $realip_remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    access_log off;
    error_log /dev/null crit;
}
