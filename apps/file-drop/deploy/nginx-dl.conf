# NPM Advanced：dl.rokano.org（灰云直连 8443）。只转发到应用直连端，应用只接受带有效短期令牌的上传与下载。
# 下载令牌在 URL 查询串里，所以关闭访问日志与错误日志；审计由应用记录（不含令牌）。
# drop_dl_conn / drop_dl_req 在 /data/nginx/custom/http.conf 中定义。
location / {
    if ($request_method !~ ^(GET|HEAD|PUT|OPTIONS)$) { return 405; }
    limit_conn drop_dl_conn 8;
    limit_req zone=drop_dl_req burst=40 nodelay;
    client_max_body_size 33m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 3s;
    set $file_drop_direct http://nas-file-drop:3001;
    proxy_pass $file_drop_direct$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 用 TCP 连接的真实来源：NPM 全局信任私有网段与 CDN 网段的 X-Real-IP，$remote_addr 可被伪造。
    proxy_set_header X-Real-IP $realip_remote_addr;
    proxy_set_header Connection "";
    access_log off;
    error_log /dev/null crit;
}
