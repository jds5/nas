<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NAS · 终端</title>
  <link rel="stylesheet" href="/terminal/assets/app.css">
  <script type="module" src="/terminal/assets/app.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/terminal" aria-label="NAS 终端首页"><span class="brand-icon">&gt;_</span><span>NAS <span class="muted">/ 终端</span></span></a>
    <span class="access-badge"><span class="dot"></span>Access 保护</span>
  </header>
  <main>
    <aside id="sidebar">
      <div class="section-heading"><h1>会话</h1><button id="refresh" class="quiet">刷新</button></div>
      <p class="intro">接回正在运行的工作。</p>
      <div id="sessions" aria-label="tmux 会话列表"></div>
      <p id="list-status" class="muted" role="status">正在读取会话…</p>
      <p class="aside-note">断开连接后，任务仍会继续运行。</p>
    </aside>
    <section class="workspace" aria-label="终端工作区">
      <div class="terminal-heading">
        <div><span id="connection-dot" class="dot idle"></span><strong id="session-name">选择一个会话</strong><span id="state">尚未连接</span></div>
        <div class="actions"><button id="reconnect" hidden>重新连接</button><button id="detach" disabled>断开</button><button id="fullscreen" title="全屏终端" aria-label="全屏终端">⛶</button></div>
      </div>
      <div id="notice" role="status" hidden></div>
      <div id="terminal-wrap"><div id="empty"><span class="empty-icon">&gt;_</span><h2>你的工作，一直都在。</h2><p>从会话列表选择，继续操作 NAS。<br>支持 Codex、命令行与启动确认界面。</p></div><div id="terminal" hidden></div></div>
      <form id="composer" autocomplete="off">
        <div id="attachments" aria-label="待发送图片"></div>
        <label for="draft" class="sr-only">消息输入</label>
        <textarea id="draft" rows="6" placeholder="输入消息，或粘贴、拖入图片…" spellcheck="false"></textarea>
        <div class="composer-actions"><button id="attach" title="PNG/JPEG/WebP，最多 4 张，共 20 MiB" type="button" disabled>添加图片</button><input id="image-files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span>Enter 发送 · Ctrl+J 换行</span><button id="send" type="submit" disabled>发送 ↵</button></div>
      </form>
      <footer><span id="hint">点击终端可直接操作命令行或初始化菜单。</span><a href="/cdn-cgi/access/logout">退出登录</a></footer>
    </section>
  </main>
</body>
</html>
